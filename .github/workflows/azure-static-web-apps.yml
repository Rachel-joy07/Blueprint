name: Deploy Blueprint to Azure Static Web Apps

# Prereqs (one-time, see README "Deploy" section):
#   1. Create the Static Web App resource (free "Free" plan tier covers a
#      student project easily): via the Azure Portal or
#      `az staticwebapp create`, choosing "Custom" / "Other" build preset
#      and GitHub as the source. Azure will offer to commit a workflow
#      file like this one automatically - if you use that flow instead,
#      just make sure app_location/api_location/output_location below
#      match this repo's layout, and delete this file to avoid duplicates.
#   2. Set the ANTHROPIC_API_KEY app setting on the Static Web App
#      (Configuration -> Application settings in the portal, or
#      `az staticwebapp appsettings set`) so the deployed /api/chat
#      endpoint can reach Claude - see README.
#   3. The AZURE_STATIC_WEB_APPS_API_TOKEN secret below is generated by
#      Azure when you create the resource and connect it to this repo -
#      GitHub Actions adds it automatically if you let Azure create the
#      workflow, or copy it from the portal's "Manage deployment token"
#      into Settings -> Secrets -> Actions if you're adding it yourself.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"       # React + Vite source
          api_location: "backend"        # Python Azure Functions (needs host.json here)
          output_location: "dist"        # Vite's build output, relative to app_location
          skip_app_build: false
          skip_api_build: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
